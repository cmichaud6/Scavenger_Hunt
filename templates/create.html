{% extends 'layout.html' %}

{% block content %}
<h2>Create a New Scavenger Hunt</h2>
<form method="POST" enctype="multipart/form-data" class="mt-4">
    <div class="mb-3">
        <label for="hunt_name" class="form-label">Hunt Name</label>
        <input type="text" class="form-control" id="hunt_name" name="hunt_name" required>
    </div>

    <div id="targets-container">
        <div class="target-block border p-3 mb-3 bg-light">
            <h4>Photo 1</h4>
            <div class="mb-3">
                <label class="form-label">Target Image (What players need to find)</label>
                <input type="file" class="target-file-input" name="target_image" accept="image/png, image/jpeg, image/*" required style="display: none;">
                <div class="d-grid gap-2 d-md-flex mt-2">
                    <button type="button" class="btn btn-secondary upload-btn">Upload from Library</button>
                    <button type="button" class="btn btn-info capture-btn">Take Photo with Camera</button>
                </div>
                <p class="file-info text-muted mt-2 mb-0">No file selected.</p>
            </div>
            <div class="mb-3">
                <label class="form-label">Clue 1 (Hardest / Most Cryptic)</label>
                <input type="text" class="form-control" name="clue1" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Clue 2 (Medium Helpfulness)</label>
                <input type="text" class="form-control" name="clue2" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Clue 3 (Easiest / Most Direct)</label>
                <input type="text" class="form-control" name="clue3" required>
            </div>
            <div class="mb-3">
                <button type="button" class="btn btn-outline-info" onclick="getLocation(this)">📍 Drop Location Pin</button>
                <span class="location-status text-muted ms-2"></span>
                <input type="hidden" name="latitude" class="lat-input">
                <input type="hidden" name="longitude" class="lng-input">
            </div>
        </div>
    </div>
    
    <div class="d-grid gap-2 d-md-block mb-3">
        <button type="button" class="btn btn-secondary" onclick="addTarget()">+ Add Another Photo</button>
        <button type="submit" class="btn btn-primary">Create Hunt</button>
    </div>
</form>

<script>
    let targetCount = 1;
    function addTarget() {
        targetCount++;
        const container = document.getElementById('targets-container');
        const block = document.createElement('div');
        block.className = 'target-block border p-3 mb-3 bg-light';
        block.innerHTML = `
            <h4>Photo ${targetCount}</h4>
            <div class="mb-3"><label class="form-label">Target Image</label>
            <input type="file" class="target-file-input" name="target_image" accept="image/png, image/jpeg, image/*" required style="display: none;">
            <div class="d-grid gap-2 d-md-flex mt-2">
                <button type="button" class="btn btn-secondary upload-btn">Upload from Library</button>
                <button type="button" class="btn btn-info capture-btn">Take Photo with Camera</button>
            </div>
            <p class="file-info text-muted mt-2 mb-0">No file selected.</p></div>
            <div class="mb-3"><label class="form-label">Clue 1</label>
            <input type="text" class="form-control" name="clue1" required></div>
            <div class="mb-3"><label class="form-label">Clue 2</label>
            <input type="text" class="form-control" name="clue2" required></div>
            <div class="mb-3"><label class="form-label">Clue 3</label>
            <input type="text" class="form-control" name="clue3" required></div>
            <div class="mb-3">
                <button type="button" class="btn btn-outline-info" onclick="getLocation(this)">📍 Drop Location Pin</button>
                <span class="location-status text-muted ms-2"></span>
                <input type="hidden" name="latitude" class="lat-input">
                <input type="hidden" name="longitude" class="lng-input">
            </div>
        `;
        container.appendChild(block);
    }

    // Use event delegation so buttons dynamically generated by addTarget() also work
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('upload-btn')) {
            const container = e.target.closest('.mb-3');
            const fileInput = container.querySelector('.target-file-input');
            fileInput.removeAttribute('capture');
            fileInput.click();
        } else if (e.target.classList.contains('capture-btn')) {
            const container = e.target.closest('.mb-3');
            const fileInput = container.querySelector('.target-file-input');
            fileInput.setAttribute('capture', 'environment');
            fileInput.click();
        }
    });

    document.addEventListener('change', function(e) {
        if (e.target.classList.contains('target-file-input')) {
            const container = e.target.closest('.mb-3');
            const fileInfo = container.querySelector('.file-info');
            if (e.target.files.length > 0) {
                fileInfo.textContent = `Selected: ${e.target.files[0].name}`;
                fileInfo.classList.remove('text-muted');
                fileInfo.classList.add('text-success', 'fw-bold');
            }
        }
    });

    function getLocation(btn) {
        const statusSpan = btn.nextElementSibling;
        const latInput = statusSpan.nextElementSibling;
        const lngInput = latInput.nextElementSibling;

        if (navigator.geolocation) {
            statusSpan.textContent = "Getting location...";
            statusSpan.className = "location-status text-warning ms-2 fw-bold";
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    latInput.value = position.coords.latitude;
                    lngInput.value = position.coords.longitude;
                    statusSpan.textContent = "Location pinned!";
                    statusSpan.className = "location-status text-success ms-2 fw-bold";
                },
                function(error) {
                    statusSpan.textContent = "Error: " + error.message;
                    statusSpan.className = "location-status text-danger ms-2 fw-bold";
                }
            );
        } else {
            statusSpan.textContent = "Geolocation is not supported by this browser.";
            statusSpan.className = "location-status text-danger ms-2 fw-bold";
        }
    }
</script>
{% endblock %}
